[package]
name = "pg_statkit"
version = "1.1.0"
edition = "2024"
license = "MIT"
description = "A PostgreSQL statistical toolkit for clinical, health, and biomedical data analysis"
repository = "https://github.com/kirdmi/pg_statkit"
readme = "README.md"
keywords = ["statistics", "clinical", "effect-size", "biostatistics", "pgrx"]

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg16"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15" ]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16" ]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19"]
pg_test = []
pg_bench = ["dep:pgrx-bench"]

[dependencies]
pgrx = "=0.20.1"

[dependencies.pgrx-bench]
version = "=0.20.1"
optional = true

[dev-dependencies]
[dev-dependencies.pgrx-tests]
version = "=0.20.1"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
