name: Rust
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [pg15, pg16, pg17, pg18, pg19]
    env:
      PGRX_HOME: /home/runner/.pgrx
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm libclang-dev \
            libreadline-dev zlib1g-dev \
            flex bison \
            libxml2-dev libxslt-dev libssl-dev \
            libicu-dev \
            pkg-config
      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version 0.20.1 --locked
      - name: Init pgrx
        run: cargo pgrx init --${{ matrix.pg }} download
      - name: Test
        run: cargo test --no-default-features --features ${{ matrix.pg }} --verbose
